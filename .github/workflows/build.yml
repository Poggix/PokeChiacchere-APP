name: Build iOS IPA (Expo Fixed)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Scompatta il progetto
        run: |
          unzip pokechiacchere.zip
          if [ -d "pokechiacchere" ]; then
            mv pokechiacchere/* .
          fi

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installa le dipendenze di Expo
        run: |
          npm install -g expo-cli
          npm install

      - name: Genera la cartella nativa iOS (Prebuild)
        run: npx expo prebuild --platform ios

      - name: Installa Cocoapods e Pods nativi
        run: |
          sudo gem install cocoapods
          cd ios && pod install --repo-update && cd ..

      - name: Compila il file .app (Senza Firma)
        run: |
          cd ios
          xcodebuild archive -workspace pokechiacchere.xcworkspace -scheme pokechiacchere -archivePath ../build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Crea il pacchetto IPA finale
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r PokeChiacchere.ipa Payload

      - name: Carica il file IPA nei download
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/PokeChiacchere.ipa
