name: Update app manifest from release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Update version.json with the published IPA
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;
            const tag = release.tag_name || '';
            const match = tag.match(/^v?(\\d+\\.\\d+\\.\\d+)-build(\\d+)$/i);
            if (!match) {
              core.setFailed(`Tag non valido: "${tag}". Usa v2.5.7-build10.`);
              return;
            }

            const version = match[1];
            const build = Number(match[2]);
            const expectedName = `PokeChiacchere-v${version}-build${build}.ipa`;
            const asset = (release.assets || []).find(item =>
              item.name.toLowerCase() === expectedName.toLowerCase()
            );

            if (!asset) {
              const available = (release.assets || []).map(item => item.name).join(', ') || '(nessun allegato)';
              core.setFailed(`IPA "${expectedName}" non trovata nella Release. Allegati: ${available}`);
              return;
            }

            const path = 'version.json';
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: context.payload.repository.default_branch
            });

            if (Array.isArray(file) || !file.content) {
              core.setFailed('version.json non è un file leggibile.');
              return;
            }

            const manifest = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            manifest.version = version;
            manifest.build = build;
            manifest.download_url = asset.browser_download_url;
            manifest.notes = release.body || `Aggiornamento PokeChiacchere v${version}, build ${build}.`;

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `chore: aggiorna version.json a v${version} build ${build}`,
              content: Buffer.from(JSON.stringify(manifest, null, 2) + '\\n').toString('base64'),
              sha: file.sha,
              branch: context.payload.repository.default_branch
            });

            core.notice(`version.json aggiornato: v${version} build ${build}`);
