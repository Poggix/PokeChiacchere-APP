name: Upload IPA su iCloud

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag della release da caricare (vuoto = ultima release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Seleziona e scarica l'IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::Nessuna release trovata. Compila prima l'app."
            exit 1
          fi

          echo "Release selezionata: $TAG"
          gh release download "$TAG" --pattern "*.ipa" --dir .

          IPA_PATH=$(find . -maxdepth 1 -name "*.ipa" -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Nessun file IPA trovato nella release $TAG."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Carica l'IPA su iCloud Drive
        env:
          ICLOUD_USERNAME: ${{ secrets.ICLOUD_USERNAME }}
          ICLOUD_PASSWORD: ${{ secrets.ICLOUD_PASSWORD }}
          ICLOUD_FOLDER_PATH: ${{ secrets.ICLOUD_FOLDER_PATH }}
          ICLOUD_2FA_CODE: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$ICLOUD_2FA_CODE" ]; then
            echo "::add-mask::$ICLOUD_2FA_CODE"
          fi

          if [ -z "$ICLOUD_USERNAME" ] || [ -z "$ICLOUD_PASSWORD" ] || [ -z "$ICLOUD_FOLDER_PATH" ]; then
            echo "::error::Configura ICLOUD_USERNAME, ICLOUD_PASSWORD e ICLOUD_FOLDER_PATH nei GitHub Secrets."
            exit 1
          fi

          python3 -m venv .venv-icloud
          .venv-icloud/bin/python -m pip install --upgrade pip
          .venv-icloud/bin/python -m pip install pyicloud
          .venv-icloud/bin/python scripts/upload_icloud.py
