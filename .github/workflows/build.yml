name: Build iOS IPA (Expo Bundle ID Fixed)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Scompatta il progetto
        run: |
          unzip pokechiacchere.zip
          if [ -d "pokechiacchere" ]; then
            mv pokechiacchere/* .
          fi

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installa EAS CLI e dipendenze
        run: |
          npm install -g eas-cli
          npm install

      - name: Configura il profilo locale
        run: |
          echo '{
            "cli": { "version": ">= 10.0.0" },
            "build": {
              "development": {
                "developmentClient": true,
                "distribution": "internal"
              },
              "preview": {
                "distribution": "internal",
                "ios": {
                  "simulator": true
                }
              },
              "production": {}
            }
          }' > eas.json

      - name: Forza Bundle Identifier e Inizializza Progetto
        env:
          EXPO_TOKEN: "INCOLLA_QUI_IL_TUO_TOKEN_DI_EXPO"
        run: |
          # Inietta il bundleIdentifier mancante nel file app.json prima del build
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            if (!data.expo) data.expo = {};
            if (!data.expo.ios) data.expo.ios = {};
            data.expo.ios.bundleIdentifier = 'com.poggix.pokechiacchere';
            fs.writeFileSync('app.json', JSON.stringify(data, null, 2));
          "
          npx eas project:init --force

      - name: Esegui EAS Build Locale (Genera IPA)
        env:
          EXPO_TOKEN: "OVszE6SOmOtd04KPGsYDu1ag362GGmKbI-nILaGd"
        run: |
          npx eas build --platform ios --local --profile preview --non-interactive

      - name: Carica il file IPA nei download
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ./*.ipa
