name: Build iOS IPA (Local Spliced)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Scompatta il progetto
        run: |
          unzip pokechiacchere.zip
          if [ -d "pokechiacchere" ]; then
            mv pokechiacchere/* .
          fi

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installa le dipendenze
        run: |
          npm install -g expo-cli
          npm install

      - name: Inietta configurazioni mancanti
        run: |
          node -e "
          const fs = require('fs');
          let data = {};
          if (fs.existsSync('app.json')) {
            data = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          }
          if (!data.expo) data.expo = {};
          data.expo.name = data.expo.name || 'PokeChiacchere';
          data.expo.slug = data.expo.slug || 'pokechiacchere';
          if (!data.expo.ios) data.expo.ios = {};
          data.expo.ios.bundleIdentifier = 'com.poggix.pokechiacchere';
          fs.writeFileSync('app.json', JSON.stringify(data, null, 2));
          "

      - name: Genera la cartella nativa iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Installa i Pods nativi Apple
        run: |
          cd ios
          pod install --repo-update

      - name: Compila il file .app (Xcode)
        run: |
          cd ios
          xcodebuild archive -workspace *.xcworkspace -scheme * -archivePath ../build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Genera il pacchetto IPA definitivo
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r PokeChiacchere.ipa Payload

      - name: Carica l'IPA negli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/PokeChiacchere.ipa
