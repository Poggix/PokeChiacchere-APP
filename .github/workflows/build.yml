name: Build iOS IPA (Expo Token)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Scompatta il progetto
        run: |
          unzip pokechiacchere.zip
          if [ -d "pokechiacchere" ]; then
            mv pokechiacchere/* .
          fi

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installa EAS CLI e dipendenze
        run: |
          npm install -g eas-cli
          npm install

      - name: Configura il profilo locale
        run: |
          echo '{
            "cli": { "version": ">= 10.0.0" },
            "build": {
              "development": {
                "developmentClient": true,
                "distribution": "internal"
              },
              "preview": {
                "distribution": "internal",
                "ios": {
                  "simulator": true
                }
              },
              "production": {}
            }
          }' > eas.json

      - name: Esegui EAS Build Locale (Genera IPA)
        env:
          EXPO_TOKEN: "5rzjejg5Znf96uMzM99cbpjmlavpJZluIcE69qfP"
        run: |
          eas build --platform ios --local --profile preview --non-interactive

      - name: Carica il file IPA nei download
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ./*.ipa
