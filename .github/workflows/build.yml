name: Build PokeChiacchere IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Leggi versione e build
        id: app_version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD=$(node -p "require('./app.json').expo.ios.buildNumber || '1'")
          SAFE_VERSION=$(echo "$VERSION" | tr '/' '-')
          FILE_NAME="PokeChiacchere-v${SAFE_VERSION}-build${BUILD}"
          TAG="v${SAFE_VERSION}-build${BUILD}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Compilazione: $FILE_NAME"

      - name: Installa e sincronizza le dipendenze
        run: npm install

      - name: Configura licenza Transistor per la build (senza salvarla nel repository)
        env:
          TRANSISTOR_IOS_LICENSE: ${{ secrets.TRANSISTOR_IOS_LICENSE }}
        run: |
          if [ -z "$TRANSISTOR_IOS_LICENSE" ]; then
            echo "::error::Manca il secret TRANSISTOR_IOS_LICENSE nelle impostazioni GitHub Actions."
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const file = 'app.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.expo.ios.infoPlist = config.expo.ios.infoPlist || {};
          config.expo.ios.infoPlist.TSLocationManagerLicense = process.env.TRANSISTOR_IOS_LICENSE;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\\n');
          NODE

      - name: Genera il progetto iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Installa CocoaPods
        run: |
          cd ios
          pod install

      - name: Compila l'app iOS senza firma
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "Errore: workspace Xcode non trovato"
            exit 1
          fi

          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | jq -r '.workspace.schemes[] | select(ascii_downcase == "pokechiacchere")' | head -n 1)

          if [ -z "$SCHEME" ]; then
            echo "Errore: schema PokeChiacchere non trovato"
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Crea l'archivio IPA con versione nel nome
        env:
          FILE_NAME: ${{ steps.app_version.outputs.file_name }}
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "Errore: applicazione compilata non trovata"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/${FILE_NAME}.ipa" Payload

      - name: Pubblica IPA su GitHub Releases e aggiorna version.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.app_version.outputs.version }}
          BUILD: ${{ steps.app_version.outputs.build }}
          FILE_NAME: ${{ steps.app_version.outputs.file_name }}
          TAG: ${{ steps.app_version.outputs.tag }}
        run: |
          IPA_PATH="${FILE_NAME}.ipa"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA_PATH}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_PATH" --clobber
          else
            gh release create "$TAG" "$IPA_PATH" \
              --target "$GITHUB_SHA" \
              --title "PokeChiacchere v${VERSION} build ${BUILD}" \
              --notes "IPA generata automaticamente da GitHub Actions."
          fi

          # Sincronizza version.json senza sovrascrivere i commit arrivati durante la build.
          # Il workflow rigenera il file partendo ogni volta dall'ultimo main remoto.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            jq --arg version "$VERSION" \
               --argjson build "$BUILD" \
               --arg url "$DOWNLOAD_URL" \
               --arg notes "Versione $VERSION build $BUILD" \
               '.version = $version | .build = $build | .download_url = $url | .notes = $notes' \
               version.json > version.json.tmp
            mv version.json.tmp version.json

            git add version.json
            if git diff --cached --quiet; then
              echo "version.json è già aggiornato."
              break
            fi

            git commit -m "Update version.json for v${VERSION} build ${BUILD}"
            if git push origin HEAD:main; then
              echo "version.json pubblicato correttamente."
              break
            fi

            if [ "$ATTEMPT" -eq 3 ]; then
              echo "Errore: impossibile pubblicare version.json dopo 3 tentativi."
              exit 1
            fi
            echo "Il branch main è cambiato durante il push; riprovo sincronizzando nuovamente."
          done

      - name: Carica anche l'artifact della compilazione
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app_version.outputs.file_name }}
          path: ${{ steps.app_version.outputs.file_name }}.ipa
          if-no-files-found: error

      - name: Invia IPA su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE_NAME: ${{ steps.app_version.outputs.file_name }}
        run: |
          IPA_PATH="${FILE_NAME}.ipa"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram non configurato: aggiungi i secrets TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID."
            exit 0
          fi

          FILE_SIZE=$(stat -f%z "$IPA_PATH")
          if [ "$FILE_SIZE" -gt 50000000 ]; then
            echo "::warning::IPA superiore a 50 MB: il Bot API standard non può inviarla come documento."
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=Build completata, ma l'IPA supera 50 MB. Scaricala da GitHub Releases: https://github.com/${GITHUB_REPOSITORY}/releases"
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${IPA_PATH};filename=${IPA_PATH}" \
            -F "caption=Build PokeChiacchere completata"
