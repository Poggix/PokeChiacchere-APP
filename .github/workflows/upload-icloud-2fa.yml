name: Upload IPA su iCloud (con sessione persistente)

on:
  workflow_dispatch:
    inputs:
      icloud_2fa_code:
        description: "Codice Apple 2FA; lascialo vuoto se la sessione salvata è ancora valida"
        required: false
        type: string
      release_tag:
        description: "Tag della release da caricare (vuoto = ultima release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Ripristina sessione cifrata
        uses: actions/cache/restore@v4
        with:
          path: .icloud-session.enc
          key: icloud-session-${{ github.run_id }}
          restore-keys: |
            icloud-session-

      - name: Prepara sessione
        env:
          SESSION_KEY: ${{ secrets.ICLOUD_SESSION_ENCRYPTION_KEY }}
          SESSION_DIR: ${{ runner.temp }}/icloudpy-session
        run: |
          set -euo pipefail
          test -n "$SESSION_KEY" || { echo "::error::Manca ICLOUD_SESSION_ENCRYPTION_KEY nei repository Secrets."; exit 1; }
          mkdir -p "$SESSION_DIR"
          if [ -s .icloud-session.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in .icloud-session.enc -pass env:SESSION_KEY | tar -xzf - -C "$SESSION_DIR"
            echo "Sessione precedente ripristinata."
          else
            echo "Nessuna sessione salvata; potrebbe essere richiesto il 2FA Apple."
          fi

      - name: Scarica IPA della release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName'); fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then echo "::error::Nessuna release trovata. Compila prima l'app."; exit 1; fi
          gh release download "$TAG" --pattern "*.ipa" --dir .
          IPA_PATH=$(find . -maxdepth 1 -name "*.ipa" -print -quit)
          if [ -z "$IPA_PATH" ]; then echo "::error::Nessun IPA trovato nella release $TAG."; exit 1; fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Carica IPA su iCloud Drive
        env:
          ICLOUD_USERNAME: ${{ secrets.ICLOUD_USERNAME }}
          ICLOUD_PASSWORD: ${{ secrets.ICLOUD_PASSWORD }}
          ICLOUD_FOLDER_PATH: ${{ secrets.ICLOUD_FOLDER_PATH }}
          ICLOUD_2FA_CODE: ${{ inputs.icloud_2fa_code }}
          ICLOUD_SESSION_DIR: ${{ runner.temp }}/icloudpy-session
        run: |
          set -euo pipefail
          if [ -n "${ICLOUD_2FA_CODE:-}" ]; then echo "::add-mask::$ICLOUD_2FA_CODE"; fi
          if [ -z "$ICLOUD_USERNAME" ] || [ -z "$ICLOUD_PASSWORD" ] || [ -z "$ICLOUD_FOLDER_PATH" ]; then
            echo "::error::Configura ICLOUD_USERNAME, ICLOUD_PASSWORD e ICLOUD_FOLDER_PATH nei GitHub Secrets."
            exit 1
          fi
          python3 -m venv .venv-icloud
          .venv-icloud/bin/python -m pip install --upgrade pip
          .venv-icloud/bin/python -m pip install "icloudpy>=0.10.0"
          .venv-icloud/bin/python scripts/upload_icloud.py

      - name: Cifra sessione per i run successivi
        if: success()
        env:
          SESSION_KEY: ${{ secrets.ICLOUD_SESSION_ENCRYPTION_KEY }}
          SESSION_DIR: ${{ runner.temp }}/icloudpy-session
        run: |
          set -euo pipefail
          tar -czf - -C "$SESSION_DIR" . | openssl enc -aes-256-cbc -pbkdf2 -salt -out .icloud-session.enc -pass env:SESSION_KEY
          test -s .icloud-session.enc

      - name: Salva sessione cifrata
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .icloud-session.enc
          key: icloud-session-${{ github.run_id }}
